name: Build and Release Runner APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools and NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Runner APK
        run: |
          ./build_android.sh -y

      - name: Locate and copy APK artifact
        run: |
          mkdir -p dist
          APK_FILE=$(find p4a_app/bin -name "*.apk" | head -n 1)
          cp "$APK_FILE" dist/pydevices-runner-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pydevices-runner-debug-apk
          path: dist/pydevices-runner-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/pydevices-runner-debug.apk
          generate_release_notes: true
