name: Build and Release Runner APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create (blank = auto v0.1.0-run<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04  # p4a bundled libffi autotools predate 24.04 autoconf (LT_SYS_SYMBOL_USCORE)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools and NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Point buildozer at the setup-android SDK/NDK
        # buildozer never reads $ANDROID_HOME -- it manages its own private
        # copy under ~/.buildozer/android/platform unless android.sdk_path /
        # android.ndk_path are set in buildozer.spec (buildozer/targets/
        # android.py: android_sdk_dir / android_ndk_dir). Point it at the SDK
        # setup-android + sdkmanager already installed instead of letting it
        # download a second copy (and fail: it looks for build-tools under
        # its own private, unpopulated tree otherwise).
        run: |
          # Must land inside [app], so insert before the [buildozer] header
          # rather than appending (which would land in [buildozer] instead).
          awk -v sdk="$ANDROID_HOME" -v ndk="$ANDROID_HOME/ndk/25.2.9519653" '
            /^\[buildozer\]/ && !done {
              print "android.sdk_path = " sdk
              print "android.ndk_path = " ndk
              print ""
              done = 1
            }
            { print }
            END { if (!done) { print "error: [buildozer] section not found" > "/dev/stderr"; exit 1 } }
          ' p4a_app/buildozer.spec > p4a_app/buildozer.spec.tmp
          mv p4a_app/buildozer.spec.tmp p4a_app/buildozer.spec
          grep -A2 '^\[buildozer\]' p4a_app/buildozer.spec | tail -n +2 | head -2

          # buildozer also hardcodes its sdkmanager lookup to the legacy
          # <sdk>/tools/bin/sdkmanager layout (buildozer/targets/android.py
          # sdkmanager_path), not <sdk>/cmdline-tools/*/bin/sdkmanager. The
          # GitHub-hosted runner image ships that legacy binary preinstalled
          # under $ANDROID_HOME/tools, and it's built against a Java version
          # old enough to need javax.xml.bind (removed in JDK 11+), so it
          # dies with NoClassDefFoundError under our JDK 17. Point the legacy
          # path at the modern cmdline-tools sdkmanager instead, which we
          # already proved works under JDK 17 in the previous step.
          # Replace the whole tools/ dir with a symlink to the modern
          # cmdline-tools/<version> dir (not just the sdkmanager binary) so
          # its bin/../lib relative layout still resolves correctly.
          modern_sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)
          if [[ -z "$modern_sdkmanager" ]]; then
            echo "::error::no sdkmanager found under $ANDROID_HOME/cmdline-tools" >&2
            find "$ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          modern_cmdline_tools=$(dirname "$(dirname "$modern_sdkmanager")")
          echo "Using cmdline-tools at: $modern_cmdline_tools"
          rm -rf "$ANDROID_HOME/tools"
          ln -sfn "$modern_cmdline_tools" "$ANDROID_HOME/tools"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Runner APK
        run: |
          ./build_android.sh -y

      - name: Locate and copy APK artifact
        run: |
          mkdir -p dist
          APK_FILE=$(find p4a_app/bin -name "*.apk" | head -n 1)
          cp "$APK_FILE" dist/pydevices-runner-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pydevices-runner-debug-apk
          path: dist/pydevices-runner-debug.apk

      - name: Resolve release tag
        id: reltag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.0-run${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: dist/pydevices-runner-debug.apk
          generate_release_notes: true
